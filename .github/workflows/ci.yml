name: Verify Ruota-del-Tempo
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check repository hygiene
        run: |
          npm ci
          node node_modules/typescript/bin/tsc -p tsconfig.hygiene.json
          node --test scripts/check-repository-hygiene_test.ts
          node scripts/check-repository-hygiene.ts
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm run build
      - run: npm run test:kit
      - run: npm run test:experiment
      - name: Verify controls and gameplay in Chrome
        run: npm run test:kit:browser
        env:
          BROWSER_BINARY: /usr/bin/google-chrome
      - name: Verify Solid and Three wheel experiment
        run: npm run test:experiment:browser
        env:
          BROWSER_BINARY: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-kit-verification
          retention-days: 3
          path: |
            artifacts/game-kit/*.json
            artifacts/game-kit/*.png
            artifacts/solid-three/*.json
            artifacts/solid-three/*.png
